name: Release Windows x64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build inputs
        run: pnpm prebuild x86_64-pc-windows-msvc

      - name: Build Windows x64 installer
        run: pnpm build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: windows-x64
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_SIGNING_ENABLED: ${{ secrets.GPG_PRIVATE_KEY != '' && secrets.GPG_KEY_ID != '' }}
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
          path: release

      - name: Validate signing configuration
        env:
          HAS_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
          HAS_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID != '' }}
        run: |
          if [ "$HAS_GPG_PRIVATE_KEY" != "$HAS_GPG_KEY_ID" ]; then
            echo 'Configure both GPG_PRIVATE_KEY and GPG_KEY_ID, or neither.' >&2
            exit 1
          fi

      - name: Generate checksums
        run: |
          cd release
          sha256sum ./*.exe > SHA256SUMS

      - name: Sign release files
        if: ${{ env.RELEASE_SIGNING_ENABLED == 'true' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          umask 077
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/release-gnupg.XXXXXX")"
          trap 'gpgconf --kill gpg-agent; rm --recursive --force -- "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys "$GPG_KEY_ID" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "$GPG_KEY_ID"
          gpg --batch --armor --export "$GPG_KEY_ID" > release/release-signing-key.asc
          for artifact in release/*.exe release/SHA256SUMS; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
              --local-user "$GPG_KEY_ID" --armor --detach-sign "$artifact" \
              3<<<"$GPG_PASSPHRASE"
            gpg --batch --verify "$artifact.asc" "$artifact"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(release/*.exe release/SHA256SUMS)
          if [ "$RELEASE_SIGNING_ENABLED" = 'true' ]; then
            assets+=(release/*.exe.asc release/SHA256SUMS.asc release/release-signing-key.asc)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes
